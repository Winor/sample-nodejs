apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-nodejs
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/external-link: http://nodejs.bnjmn.dev/my-app
spec:
  project: sample-nodejs
  source:
    repoURL: https://github.com/Winor/sample-nodejs.git
    targetRevision: main
    path: chart
    helm:
      releaseName: sample-nodejs
      valueFiles:
        - ../gitops/values.yaml
        - ../gitops/image.json
      # Argo CD does not run Helm test hooks. Use the PostSync Job instead.
      skipTests: true
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-nodejs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m