name: Trunk CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Promotion PRs only change this file; Argo CD reconciles it without rebuilding.
    # PR runs are deliberately NOT filtered, so required checks still run.
    paths-ignore:
      - gitops/image.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Independent checks → build → Trivy → smoke → publish → release/promotion PRs.
  sast:
    name: SAST (njsscan)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Error-level findings and scanner failures block the build; warnings are advisory.
      - name: Scan Node.js source
        uses: ajinabraham/njsscan-action@231750a435d85095d33be7d192d52ec650625146 # v9
        with:
          args: 'app.js'

  dependency-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # Audit the committed dependency graph, including dev dependencies, without
      # installing packages or running lifecycle scripts. Registry errors also fail.
      - name: Audit locked dependencies (high and critical)
        run: npm audit --package-lock-only --audit-level=high

  build:
    name: Build, smoke-test and publish image
    needs: [sast, dependency-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Check application syntax
        run: node --check app.js

      - name: Prepare image metadata
        id: metadata
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a stable package version (X.Y.Z).' >&2
            exit 1
          fi
          node -e '
            const assert = require("node:assert/strict");
            const version = require("./package.json").version;
            const lock = require("./package-lock.json");
            assert.equal(lock.version, version, "Lockfile version must match package.json");
            assert.equal(lock.packages[""].version, version, "Lockfile root version must match package.json");
          '
          image="ghcr.io/${REPOSITORY,,}"
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            tag="${version}-pr.${PR_NUMBER}.sha${COMMIT_SHA}"
          else
            tag="${version}-ci.sha${COMMIT_SHA}"
          fi

          {
            echo "image=$image"
            echo "tag=$tag"
            echo "version=$version"
            echo "ref=$image:$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # No compile step: the Dockerfile installs locked production dependencies
      # with npm ci and copies app.js, which Node.js executes directly.
      - name: Build and load image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.metadata.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The local Docker load/push path does not retain attestations.
          provenance: false
          sbom: false

      # Scan the exact local image before any registry login or push. Findings
      # without available fixes also block publication; scan errors fail closed.
      - name: Scan image with Trivy (high and critical)
        id: trivy
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: ${{ steps.metadata.outputs.ref }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: table
          timeout: 5m
        env:
          # Do not fall back to pulling a different image from a registry.
          TRIVY_IMAGE_SRC: docker

      - name: Smoke-test the built image
        id: smoke
        timeout-minutes: 3
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.ref }}
        run: docker compose -f compose.smoke.yml up --no-build --abort-on-container-exit --exit-code-from smoke

      - name: Collect smoke-test logs
        if: always() && steps.smoke.outcome != 'skipped'
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.ref }}
        run: docker compose -f compose.smoke.yml logs --no-color

      - name: Clean up smoke-test services
        if: always() && steps.smoke.outcome != 'skipped'
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.ref }}
        run: docker compose -f compose.smoke.yml down --volumes --remove-orphans

      # Fork PRs and manual runs on non-main branches never log in or publish.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.trivy.outcome == 'success' && steps.smoke.outcome == 'success'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.trivy.outcome == 'success' && steps.smoke.outcome == 'success'
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.ref }}
        run: |
          docker push "$IMAGE_REF"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REF")
          echo "digest=${reference#*@}" >> "$GITHUB_OUTPUT"

      - name: Write build summary
        if: always()
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.ref }}
          VERSION: ${{ steps.metadata.outputs.version }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          TRIVY_RESULT: ${{ steps.trivy.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
        run: |
          {
            echo '## 📦 Container build'
            echo '| Item | Result |'
            echo '| --- | --- |'
            echo "| Package version | \`${VERSION:-unavailable}\` |"
            echo "| Image | \`${IMAGE_REF:-unavailable}\` |"
            echo "| Trivy (high/critical, including unfixed) | ${TRIVY_RESULT:-skipped} |"
            echo "| Smoke tests | ${SMOKE_RESULT:-skipped} |"
            echo "| Publication | ${PUBLISH_RESULT:-skipped} |"
            echo "| Published digest | \`${DIGEST:-not published}\` |"
            echo ''
            echo "Smoke endpoints: \`/ready\`, \`/live\`, \`/my-app\`, \`/metrics\`."
            echo 'Deployment is promoted through a reviewed GitOps PR; CI does not access the cluster.'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Propose GitOps image promotion
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Guard against stale promotion
        id: current
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]; then
            echo 'promote=true' >> "$GITHUB_OUTPUT"
          else
            echo 'promote=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; leave promotion to its pipeline.'
          fi

      - name: Record scanned image digest
        if: steps.current.outputs.promote == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/promote-image.cjs

      - name: Open or update promotion PR
        id: promotion
        if: steps.current.outputs.promote == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          base: main
          branch: gitops/promote-image
          delete-branch: true
          add-paths: gitops/image.json
          commit-message: 'chore(gitops): promote scanned application image'
          title: 'chore(gitops): promote scanned application image'
          body: |
            Promote the image built, scanned by Trivy, smoke-tested and published by:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Source commit: `${{ github.sha }}`
            Image: `${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}`

            Review the digest and CI checks before merging. Argo CD follows main.
            This PR changes only deployment values; no rebuild is needed after merge.

      - name: Write promotion summary
        if: always()
        env:
          RESULT: ${{ steps.promotion.outcome }}
          URL: ${{ steps.promotion.outputs.pull-request-url }}
          CUSTOM_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: |
          {
            echo '## GitOps promotion'
            echo "- PR step: ${RESULT:-skipped}"
            echo "- Promotion PR: ${URL:-none}"
            echo '- Cluster rollout occurs only after merge and Argo CD reconciliation.'
            if [[ "$CUSTOM_TOKEN" != 'true' ]]; then
              echo '> Configure RELEASE_PLEASE_TOKEN so promotion PRs trigger required CI checks.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release PR and GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # A PAT or App token lets release PR events trigger the normal PR checks.
      # The built-in token works, but its PR events do not start other workflows.
      - name: Maintain release PR or publish merged release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Write release summary
        if: always()
        env:
          RELEASE_RESULT: ${{ steps.release.outcome }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_URL: ${{ steps.release.outputs.html_url }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          CUSTOM_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: |
          {
            echo '## 🚀 Release Please'
            echo '| Item | Result |'
            echo '| --- | --- |'
            echo "| Automation | $RELEASE_RESULT |"
            echo "| Release PR created/updated | ${PRS_CREATED:-false} |"
            echo "| Release created | ${RELEASE_CREATED:-false} |"
            echo "| Release tag | ${RELEASE_TAG:-none} |"
            if [[ -n "$RELEASE_URL" ]]; then
              echo "| GitHub release | $RELEASE_URL |"
            fi
            echo ''
            echo 'Merge the release PR to accept package/lockfile versions and release notes.'
            if [[ "$CUSTOM_TOKEN" != 'true' ]]; then
              echo '> ⚠️ Configure RELEASE_PLEASE_TOKEN so generated release PRs trigger CI automatically. Do not merge an unchecked release PR.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"