apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "chart.fullname" . }}-test-connection"
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37.0
      command: ['sh', '-ec']
      args:
        - |
          wget -q -T 5 -O - http://{{ include "chart.fullname" . }}:{{ .Values.service.port }}/ready
          wget -q -T 5 -O - http://{{ include "chart.fullname" . }}:{{ .Values.service.port }}/my-app
          wget -q -T 5 -O /dev/null http://{{ include "chart.fullname" . }}:{{ .Values.service.port }}/metrics
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
  restartPolicy: Never
